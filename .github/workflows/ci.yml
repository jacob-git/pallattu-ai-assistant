name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build distribution
        run: |
          pip install build
          python -m build

      - name: Verify wheel install
        shell: bash
        run: |
          python -m venv /tmp/pallattu-wheel-test
          source /tmp/pallattu-wheel-test/bin/activate
          pip install dist/*.whl
          pallattu-ai-assistant --version
          pallattu-ai-assistant --help
