[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pallattu-ai-assistant"
version = "0.5.1"
description = "Portable, cost-efficient, local-first AI voice assistant runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
  "openai>=1.100,<2.0",
  "openwakeword>=0.6,<1.0",
  "psutil>=7.0,<8.0",
  "pysilero-vad>=3.4,<4.0",
  "python-dotenv>=1.0,<2.0",
  "sounddevice>=0.5,<1.0",
  "webrtcvad-wheels>=2.0.14,<3.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
pallattu-ai-assistant = "pallattu_ai_assistant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
